[colors]
background = #1e1e2e
foreground = #cdd6f4
alt = #313244
accent = #89b4fa
urgent = #f38ba8

[bar/main]
width = 100%
height = 24pt
# radius = 12
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.alt}
font-0 = JetBrains Mono:size=10
modules-left = workspaces
modules-center = window
modules-right = pulseaudio network date
tray-position = right
tray-padding = 2
cursor-click = pointer
wm-restack = i3

[module/workspaces]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
enable-click = true
enable-scroll = false
label-focused = %name%
label-focused-background = #313244
label-focused-underline = #89b4fa
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-padding = 1
label-urgent = %name%
label-urgent-background = #f38ba8
label-urgent-padding = 1

[module/window]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = vol %percentage%%
label-muted = muted

[module/network]
type = internal/network
interface-type = wired
interval = 3
label-connected = %local_ip%
label-disconnected = disconnected

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%

[settings]
screenchange-reload = true
pseudo-transparency = false
