# Dark Modern-inspired palette — extra dark

# ── Font
font_size 10
font_family JetBrains Mono

# ── Colors
foreground #C9CDD5
background #090B10
cursor #AEAFAD
cursor_text_color #090B10
selection_background #203D5B
selection_foreground #FFFFFF

# ── ANSI colors
# Normal
color0  #111319
color1  #F14C4C
color2  #23D18B
color3  #E5E510
color4  #3794FF
color5  #BC3FBC
color6  #29B8DB
color7  #C9CDD5

# Bright
color8  #555B66
color9  #FF6161
color10 #3FE3A0
color11 #F5F543
color12 #5EAFFF
color13 #D670D6
color14 #4FC1FF
